name: TroyTravel
options:
  bundleIdPrefix: app.gettroy
  deploymentTarget:
    iOS: "17.0"
packages:
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    from: 3.31.3
  swift-huggingface:
    url: https://github.com/huggingface/swift-huggingface
    from: 0.9.0
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.3.0
targets:
  TroyTravel:
    type: application
    platform: iOS
    sources:
      - path: TroyTravel
        excludes: ["TroyModel"]
      # Troy-exported model bundled as a folder reference (dev convenience;
      # absent from git — run `troy export -f ios` and copy output/fused here).
      - path: TroyTravel/TroyModel
        type: folder
        buildPhase: resources
        optional: true
    dependencies:
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: mlx-swift-lm
        product: MLXHuggingFace
      - package: swift-huggingface
        product: HuggingFace
      - package: swift-transformers
        product: Tokenizers
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.gettroy.TroyTravel
        CODE_SIGN_ENTITLEMENTS: TroyTravel/TroyTravel.entitlements
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1,2"
