name: TroyWorker
options:
  bundleIdPrefix: app.gettroy
  deploymentTarget:
    iOS: "17.0"
packages:
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    from: 3.31.3
  swift-huggingface:
    url: https://github.com/huggingface/swift-huggingface
    from: 0.9.0
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.3.0
targets:
  TroyWorker:
    type: application
    platform: iOS
    sources: [TroyWorker]
    dependencies:
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: mlx-swift-lm
        product: MLXHuggingFace
      - package: swift-huggingface
        product: HuggingFace
      - package: swift-transformers
        product: Tokenizers
    # ATS + local-network need dict-valued Info.plist keys, so this target
    # uses an xcodegen-generated plist instead of GENERATE_INFOPLIST_FILE.
    info:
      path: TroyWorker/Info.plist
      properties:
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: >-
          Connects to your Mac's troy mesh coordinator on the local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.gettroy.TroyWorker
        CODE_SIGN_ENTITLEMENTS: TroyWorker/TroyWorker.entitlements
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1,2"
