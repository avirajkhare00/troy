name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write   # PyPI trusted publishing

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --quiet build
          python -m build cli/ --outdir dist/

      - name: Smoke-check the wheel
        run: |
          python -m pip install --quiet dist/*.whl
          troy --version

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --title "Troy ${GITHUB_REF_NAME}" --generate-notes || true

      - name: Bump Homebrew formula
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "TAP_GITHUB_TOKEN not set — skipping formula bump."
            exit 0
          fi
          TAG="${GITHUB_REF_NAME}"
          curl -sL "https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${TAG}.tar.gz" -o release.tar.gz
          SHA=$(shasum -a 256 release.tar.gz | cut -d' ' -f1)
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/avirajkhare00/homebrew-troy.git" tap
          cd tap
          sed -i '' -E "s|refs/tags/v[0-9.]+\.tar\.gz|refs/tags/${TAG}.tar.gz|; s|sha256 \".*\"|sha256 \"${SHA}\"|" Formula/troy.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "troy ${TAG}"
          git push
