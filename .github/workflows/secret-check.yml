name: Secret check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then echo "EMPTY"; exit 1; fi
          echo "set, length ${#TAP_TOKEN}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $TAP_TOKEN" https://api.github.com/repos/avirajkhare00/homebrew-troy)
          echo "API access to homebrew-troy: HTTP $STATUS"
